name: Build VistaGlow
on:
  push:
    branches: [main]
    paths: ["src/**", "build.sh", ".github/workflows/build.yml", "README.md"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Restore signing key
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the KEYSTORE_B64 secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
      - name: Build
        env:
          KEYSTORE: ${{ runner.temp }}/key.jks
          KS_PASS: android
          KS_ALIAS: tvhome
        run: VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER)) ./build.sh
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          VC=$((1000 + GITHUB_RUN_NUMBER))
          gh release create "v$VC" build/vistaglow.apk --title "VistaGlow $VC" --notes "$(git log -1 --pretty=%s)"
