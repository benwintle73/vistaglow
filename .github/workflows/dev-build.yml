name: Dev build (no release)
# Builds and tests any branch except main. Nothing is published as a release, so the
# launcher's auto-update never sees these builds. The APK is attached to the run as an artifact.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: write   # only to store the test APK on the dev-apk branch (not a release)
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Unit tests
        run: ./run-tests.sh
      - name: Restore signing key
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
      - name: Build (same version code as the latest release, so it installs over it and never blocks a real update)
        env:
          KEYSTORE: ${{ runner.temp }}/key.jks
          KS_PASS: android
          KS_ALIAS: tvhome
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | tr -dc '0-9')
          VERSION_CODE="$LATEST" VERSION_NAME="$LATEST-dev.$GITHUB_RUN_NUMBER" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vistaglow-dev-${{ github.run_number }}
          path: build/vistaglow.apk
      - name: Store the APK on the dev-apk branch (not a release; the launcher only updates from releases)
        run: |
          BR="${GITHUB_REF_NAME//\//-}"
          mkdir -p "$RUNNER_TEMP/apk" && cp build/vistaglow.apk "$RUNNER_TEMP/apk/vistaglow-$BR.apk"
          cd "$RUNNER_TEMP/apk"
          git init -q && git checkout -q -b dev-apk
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Test APK from $GITHUB_REF_NAME run $GITHUB_RUN_NUMBER ($GITHUB_SHA)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" dev-apk
