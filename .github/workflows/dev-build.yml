name: Dev build (no release)
# Builds and tests any branch except main. Nothing is published as a release, so the
# launcher's auto-update never sees these builds. The APK is attached to the run as an artifact.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Unit tests
        run: ./run-tests.sh
      - name: Restore signing key
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::KEYSTORE_B64 secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
      - name: Build (same version code as the latest release, so it installs over it and never blocks a real update)
        env:
          KEYSTORE: ${{ runner.temp }}/key.jks
          KS_PASS: android
          KS_ALIAS: tvhome
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName | tr -dc '0-9')
          VERSION_CODE="$LATEST" VERSION_NAME="$LATEST-dev.$GITHUB_RUN_NUMBER" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vistaglow-dev-${{ github.run_number }}
          path: build/vistaglow.apk
